
name: Build DiscordEcho

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download Source
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Build
        run: |
          make clean
          make

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: DiscordEcho-Build
          path: .theos/obj/
